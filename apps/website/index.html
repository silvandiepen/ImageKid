<!doctype html>
<html lang="en" data-theme="light" data-color-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ImageKid is a native Mac utility for inspecting, editing, and exporting images, with basic local video playback." />
    <meta name="theme-color" content="#f8f8f6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("imagekid-color-mode");
        } catch {
          stored = null;
        }
        const mode = stored === "light" || stored === "dark" || stored === "auto" ? stored : "light";
        const theme = mode === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
        document.documentElement.dataset.colorMode = mode;
        document.documentElement.dataset.theme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === "dark" ? "#151820" : "#f8f8f6";
      })();
    </script>
    <title>ImageKid — Local image tools for Mac</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
