name: ImageKid
options:
  bundleIdPrefix: com.hakobs
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
packages:
  ImageKidInference:
    path: ../../packages/ImageKidInference
  ImageKidKit:
    path: ../../packages/ImageKidKit
  ImageKidCore:
    path: ../../packages/ImageKidCore
  FekthorKit:
    path: ../../packages/FekthorKit
targets:
  ImageKid:
    type: application
    platform: macOS
    sources:
      - path: Sources/ImageKid
    resources:
      - path: Sources/ImageKid/Resources/Assets.xcassets
      - path: Sources/ImageKid/Resources
    dependencies:
      - package: ImageKidInference
      - package: ImageKidKit
      - package: ImageKidCore
    entitlements:
      path: Sources/ImageKid/ImageKid.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.com.hakobs.imagekid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.imagekid
        PRODUCT_NAME: ImageKid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ImageKid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  ImageKidUpscale:
    type: application
    platform: macOS
    sources:
      - path: Sources/CompanionSupport
      - path: Sources/ImageKidUpscale
    resources:
      - path: Sources/ImageKid/Resources/Assets.xcassets
    dependencies:
      - package: ImageKidInference
    entitlements:
      path: Sources/CompanionSupport/ImageKidCompanion.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Needed to remember the chosen output folder across launches: a security-scoped
        # bookmark is the only way a sandboxed app keeps write access to it.
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups:
          - group.com.hakobs.imagekid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.imagekid.upscale
        PRODUCT_NAME: ImageKid Upscale
        ASSETCATALOG_COMPILER_APPICON_NAME: UpscaleAppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ImageKid Upscale
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  ImageKidCutout:
    type: application
    platform: macOS
    sources:
      - path: Sources/CompanionSupport
      - path: Sources/ImageKidCutout
      # The asset catalog must be a source entry: XcodeGen has no top-level
      # `resources:` key, so listing it there produced no Resources build phase
      # and shipped the app without its icon.
      - path: Sources/ImageKid/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ImageKidInference
    entitlements:
      path: Sources/CompanionSupport/ImageKidCompanion.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups:
          - group.com.hakobs.imagekid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.imagekid.cutout
        PRODUCT_NAME: Cutout
        ASSETCATALOG_COMPILER_APPICON_NAME: CutoutAppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cutout
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  Fekthor:
    type: application
    platform: macOS
    sources:
      - path: Sources/FekthorTrace
    resources:
      - path: Sources/FekthorTrace/Resources/Assets.xcassets
    dependencies:
      - package: FekthorKit
      - package: ImageKidKit
      - package: ImageKidInference
    entitlements:
      path: Sources/FekthorTrace/Fekthor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # No network entitlement: Fekthor is local-first and never downloads
        # at runtime (models are installed locally; see ModelStore).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.fekthor
        PRODUCT_NAME: Fekthor
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fekthor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  FekthorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/FekthorUITests
    dependencies:
      - target: Fekthor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.fekthor.uitests
        PRODUCT_NAME: FekthorUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
  ImageKidCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/CompanionSupport
      # The mask is the one piece of the editor that is pure logic, so it is tested
      # here rather than left to click-testing.
      - path: Sources/ImageKidCutout/CutoutMask.swift
      - path: Tests/ImageKidCompanionTests
    dependencies:
      - package: ImageKidInference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.imagekid.companion-tests
        PRODUCT_NAME: ImageKid Companion Tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
# Explicit schemes replace Xcode's auto-created ones once any scheme is
# defined, so Fekthor keeps a shared scheme of its own — with the UI smoke
# suite attached to its test action — next to the dedicated test scheme.
schemes:
  Fekthor:
    build:
      targets:
        Fekthor: all
    run:
      config: Debug
    test:
      targets:
        - FekthorUITests
  FekthorUITests:
    build:
      targets:
        Fekthor: all
        FekthorUITests: [test]
    test:
      targets:
        - FekthorUITests
