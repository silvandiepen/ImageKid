name: ImageKid
options:
  bundleIdPrefix: com.hakobs
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
packages:
  ImageKidInference:
    path: ../../packages/ImageKidInference
targets:
  ImageKid:
    type: application
    platform: macOS
    sources:
      - path: Sources/ImageKid
    resources:
      - path: Sources/ImageKid/Resources/Assets.xcassets
      - path: Sources/ImageKid/Resources
    dependencies:
      - package: ImageKidInference
    entitlements:
      path: Sources/ImageKid/ImageKid.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.imagekid
        PRODUCT_NAME: ImageKid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ImageKid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
