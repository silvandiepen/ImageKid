name: ImageKid
options:
  bundleIdPrefix: com.hakobs
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
packages:
  ImageKidInference:
    path: ../../packages/ImageKidInference
  ImageKidKit:
    path: ../../packages/ImageKidKit
  ImageKidCore:
    path: ../../packages/ImageKidCore
  FekthorKit:
    path: ../../packages/FekthorKit
  BrushKit:
    path: ../../packages/BrushKit
  BrushRender:
    path: ../../packages/BrushRender
  InkaKit:
    path: ../../packages/InkaKit
  ImageKidSculptorKit:
    path: ../../packages/ImageKidSculptorKit
targets:
  ImageKid:
    type: application
    platform: macOS
    sources:
      - path: Sources/ImageKid
    resources:
      - path: Sources/ImageKid/Resources/Assets.xcassets
      - path: Sources/ImageKid/Resources
    dependencies:
      - package: ImageKidInference
      - package: ImageKidKit
      - package: ImageKidCore
    entitlements:
      path: Sources/ImageKid/ImageKid.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.com.hakobs.imagekid
    # A hand-written plist (generated by XcodeGen, gitignored like the iOS
    # one) because CFBundleDocumentTypes is an array: INFOPLIST_KEY_* build
    # settings only carry scalars.
    info:
      path: Sources/ImageKid/Info.plist
      properties:
        CFBundleDisplayName: ImageKid
        LSApplicationCategoryType: public.app-category.graphics-design
        # The keys Xcode's generated plist used to supply for us.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # Without a declared document type LaunchServices never hands the app
        # a file: the Dock icon refuses the drag, and "Open With" hides
        # ImageKid. Alternate rank keeps Preview the system default viewer;
        # the app delegate's openFiles/open(urls:) already does the opening.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.imagekid
        PRODUCT_NAME: ImageKid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  ImageKidUpscale:
    type: application
    platform: macOS
    sources:
      - path: Sources/CompanionSupport
      - path: Sources/ImageKidUpscale
      # Must live under `sources` — XcodeGen has no `resources` key, so a
      # catalog listed there is silently dropped and the app ships iconless.
      - path: Sources/ImageKid/Resources/Assets.xcassets
    dependencies:
      - package: ImageKidInference
    entitlements:
      path: Sources/CompanionSupport/ImageKidCompanion.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.com.hakobs.imagekid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.imagekid.upscale
        PRODUCT_NAME: ImageKid Upscale
        ASSETCATALOG_COMPILER_APPICON_NAME: UpscaleAppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ImageKid Upscale
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  ImageKidCutout:
    type: application
    platform: macOS
    sources:
      - path: Sources/CompanionSupport
      - path: Sources/ImageKidCutout
      # See ImageKidUpscale: `resources` is not an XcodeGen key.
      - path: Sources/ImageKid/Resources/Assets.xcassets
    dependencies:
      - package: ImageKidInference
    entitlements:
      path: Sources/CompanionSupport/ImageKidCompanion.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.com.hakobs.imagekid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.imagekid.cutout
        PRODUCT_NAME: ImageKid Cutout
        ASSETCATALOG_COMPILER_APPICON_NAME: CutoutAppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ImageKid Cutout
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  ImageKidSculptor:
    type: application
    platform: macOS
    sources:
      - path: Sources/ImageKidSculptor
      # See ImageKidUpscale: `resources` is not an XcodeGen key.
      - path: Sources/ImageKid/Resources/Assets.xcassets
    dependencies:
      - package: ImageKidSculptorKit
    # Sandboxed, like the other companions. A sandboxed process may only
    # execute binaries inside its own bundle, so this depends on the Python
    # runtime being packaged into Contents/Resources/sculptor-engine by
    # tools/sculptor-engine/scripts/bundle_runtime.sh. A build without that step
    # will start and then report that no engine was found.
    #
    # Two entitlements beyond the companion set, both load-bearing:
    # network.client for the model download, and disable-library-validation so
    # the hardened runtime will load PyTorch's unsigned native extensions.
    entitlements:
      path: Sources/ImageKidSculptor/ImageKidSculptor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.application-groups:
          - group.com.hakobs.imagekid
    # A hand-written plist, like the main ImageKid target: CFBundleDocumentTypes
    # is an array, and INFOPLIST_KEY_* build settings only carry scalars.
    # Without a declared document type, LaunchServices never hands the app a
    # file, so "Open With" hides Sculptor and dropping onto the Dock icon fails.
    info:
      path: Sources/ImageKidSculptor/Info.plist
      properties:
        CFBundleDisplayName: ImageKid Sculptor
        LSApplicationCategoryType: public.app-category.graphics-design
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            # Alternate so Sculptor never displaces Preview as the default
            # image viewer; the app delegate does the opening.
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.imagekid.sculptor
        PRODUCT_NAME: ImageKid Sculptor
        ASSETCATALOG_COMPILER_APPICON_NAME: SculptorAppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  Fekthor:
    type: application
    platform: macOS
    sources:
      - path: Sources/FekthorTrace
    resources:
      - path: Sources/FekthorTrace/Resources/Assets.xcassets
    dependencies:
      - package: FekthorKit
      - package: ImageKidKit
      - package: ImageKidInference
    entitlements:
      path: Sources/FekthorTrace/Fekthor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # No network entitlement: Fekthor is local-first and never downloads
        # at runtime (models are installed locally; see ModelStore).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.fekthor
        PRODUCT_NAME: Fekthor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fekthor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  Inka:
    type: application
    platform: macOS
    sources:
      - path: Sources/Inka
    resources:
      - path: Sources/Inka/Resources/Assets.xcassets
    dependencies:
      - package: InkaKit
      - package: BrushKit
      - package: BrushRender
      - package: ImageKidKit
      - package: ImageKidCore
    entitlements:
      path: Sources/Inka/Inka.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Local-first: no network entitlement.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.inka
        PRODUCT_NAME: Inka
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inka
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  FekthorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/FekthorUITests
    dependencies:
      - target: Fekthor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.fekthor.uitests
        PRODUCT_NAME: FekthorUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
  ImageKidCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/CompanionSupport
      - path: Tests/ImageKidCompanionTests
    dependencies:
      - package: ImageKidInference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakobs.imagekid.companion-tests
        PRODUCT_NAME: ImageKid Companion Tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
# Explicit schemes replace Xcode's auto-created ones once any scheme is
# defined, so Fekthor keeps a shared scheme of its own — with the UI smoke
# suite attached to its test action — next to the dedicated test scheme.
schemes:
  Fekthor:
    build:
      targets:
        Fekthor: all
    run:
      config: Debug
    test:
      targets:
        - FekthorUITests
  Inka:
    build:
      targets:
        Inka: all
    run:
      config: Debug
  FekthorUITests:
    build:
      targets:
        Fekthor: all
        FekthorUITests: [test]
    test:
      targets:
        - FekthorUITests
