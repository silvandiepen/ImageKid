name: Native macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/native-macos/**"
      - ".github/workflows/build.yml"
  push:
    branches: [main, development]
    paths:
      - "apps/native-macos/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/native-macos
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Build
        run: swift build
      - name: Test
        run: swift test
